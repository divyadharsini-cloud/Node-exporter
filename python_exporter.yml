---
- name: Deploy Python Prometheus Asset Exporter with CrowdStrike Metrics
  hosts: FH-3G(rec)
  become: yes

  tasks:
    - name: Ensure curl is installed
      apt:
        name: curl
        state: present
        update_cache: yes

    - name: Ensure Python3 is installed
      apt:
        name: python3
        state: present

    - name: Download get-pip.py
      get_url:
        url: https://bootstrap.pypa.io/get-pip.py
        dest: /tmp/get-pip.py
        mode: '0755'

    - name: Install pip system-wide
      command: python3 /tmp/get-pip.py --break-system-packages
      args:
        creates: /usr/local/bin/pip3

    - name: Install Python dependencies globally
      command: python3 -m pip install --break-system-packages prometheus_client psutil distro

    - name: Ensure /opt directory exists
      file:
        path: /opt
        state: directory
        mode: '0755'

    - name: Deploy asset_agent.py exporter
      copy:
        dest: /opt/asset_agent.py
        mode: '0755'
        content: |
          #!/usr/bin/env python3
          import time
          import psutil
          import platform
          import socket
          import subprocess
          import re
          import distro
          import os
          from prometheus_client import start_http_server, Gauge, Info

          hostname = socket.gethostname()

          # ----------------------------
          # Hardware Gauges
          # ----------------------------
          cpu_cores = Gauge('asset_cpu_cores', 'CPU core count', ['hostname'])
          ram_total = Gauge('asset_ram_total_mb', 'Total RAM in MB', ['hostname'])
          ram_used = Gauge('asset_ram_used_mb', 'Used RAM in MB', ['hostname'])
          disk_total = Gauge('asset_disk_total_bytes', 'Total disk space in bytes', ['hostname', 'disk'])
          disk_used = Gauge('asset_disk_used_bytes', 'Used disk space in bytes', ['hostname', 'disk'])
          packages_count = Gauge('asset_installed_packages_total', 'Installed package count', ['hostname'])
          users_gauge = Gauge('asset_logged_in_users', 'Number of logged-in users', ['hostname'])
          uptime_gauge = Gauge('asset_uptime_seconds', 'System uptime in seconds', ['hostname'])
          cpu_utilization = Gauge('asset_cpu_utilization_percent', 'CPU utilization percentage', ['hostname'])

          # ----------------------------
          # Patch status Metrics
          # ----------------------------
          patch_status_gauge = Gauge(
              'endpoint_patch_status',
              'patch status (1=SUCCESS, 2=UP-TO-DATE, 0=FAILED)',
              ['hostname']
          )

          patch_last_applied = Gauge(
              'endpoint_patch_last_applied_timestamp',
              'Last patch applied time (Unix epoch)',
              ['hostname']
          )

          # ----------------------------
          # Cache Metrics
          # ----------------------------
          CACHE_STATUS = Gauge('cache_cleared_today', '1 if cache was cleared today, else 0', ['hostname'])
          CACHE_TIME = Gauge('cache_last_cleared_timestamp', 'Unix timestamp of last cache clear', ['hostname'])

          # ----------------------------
          # CrowdStrike Metrics
          # ----------------------------
          cs_sensor_status = Gauge('crowdstrike_sensor_status', 'CrowdStrike Sensor Status (1=running, 0=stopped)', ['hostname'])
          cs_cloud_connection = Gauge('crowdstrike_cloud_connection', 'CrowdStrike Cloud Connection (1=connected, 0=disconnected)', ['hostname'])
          cs_sensor_version = Gauge('crowdstrike_sensor_version', 'CrowdStrike Sensor Version numeric', ['hostname'])
          cs_last_update = Gauge('crowdstrike_last_update_timestamp', 'Last CrowdStrike agent update timestamp (Unix)', ['hostname'])

          # ----------------------------
          # Info Metrics
          # ----------------------------
          cpu_model = Info('asset_cpu_model_info', 'CPU model info')
          processor_model = Info('asset_processor_model_info', 'Processor model')
          cpu_generation = Info('asset_cpu_generation_info', 'CPU generation')
          os_version = Info('asset_os_version_info', 'OS version info')
          kernel_version = Info('asset_kernel_info', 'Kernel version')
          architecture = Info('asset_architecture_info', 'System architecture')
          ip_info = Info('asset_ip_address_info', 'Primary IP address')
          ip_all_info = Info('asset_all_ip_info', 'All IP addresses')
          mac_info = Info('asset_mac_address_info', 'MAC address')
          serial_info = Info('asset_serial_number_info', 'System serial number')
          manufacturer_info = Info('asset_manufacturer_info', 'System manufacturer with manufacture date')
          model_info = Info('asset_model_info', 'System model')
          bios_info = Info('asset_bios_info', 'BIOS version')

          # ----------------------------
          # Patch Status Reader
          # ----------------------------
          PATCH_FILE = "/opt/patch_status.txt"
          
          def update_patch_status():
              try:
                  status = 0
                  patch_time = 0
                  
                  if not os.path.exists(PATCH_FILE):
                      patch_status_gauge.labels(hostname=hostname).set(0)
                      patch_last_applied.labels(hostname=hostname).set(0)
                      return

                  with open(PATCH_FILE, "r") as f:
                      for line in f:
                          line = line.strip()

                          if line.startswith("result="):
                              if "SUCCESS" in line:
                                  status_value = 1
                              elif "UP-TO-DATE" in line:
                                  status_value = 2
                              else:
                                  status_value = 0

                          if line.startswith("time="):
                              patch_time = int(line.split("=")[1])

                  
                  patch_status_gauge.labels(hostname=hostname).set(status_value)
                  patch_last_applied.labels(hostname=hostname).set(patch_time)
              
              except Exception as e:
                  print(f"Patch status error: {e}")
                  patch_status_gauge.labels(hostname=hostname).set(0)
                  patch_last_applied.labels(hostname=hostname).set(0)

          # ----------------------------
          # Helper Functions
          # ----------------------------
          def get_ip():
              for iface_name, iface_addrs in psutil.net_if_addrs().items():
                  for addr in iface_addrs:
                      if addr.family == socket.AF_INET and not addr.address.startswith('127.'):
                          return addr.address
              return 'unknown'

          def get_all_ips():
              ips = []
              for iface, addrs in psutil.net_if_addrs().items():
                  for addr in addrs:
                      if addr.family == socket.AF_INET and not addr.address.startswith("127."):
                          ips.append(f"{iface}:{addr.address}")
              return ips

          def get_mac():
              for iface_name, iface_addrs in psutil.net_if_addrs().items():
                  for addr in iface_addrs:
                      if hasattr(psutil, "AF_LINK"):
                          if addr.family == psutil.AF_LINK and addr.address != '00:00:00:00:00:00':
                              return addr.address
              return 'unknown'

          def get_serial_number():
              try:
                  return subprocess.check_output(['dmidecode', '-s', 'system-serial-number'], text=True).strip()
              except Exception:
                  return 'unknown'

          def get_manufacturer():
              try:
                  return subprocess.check_output(['dmidecode', '-s', 'system-manufacturer'], text=True).strip()
              except Exception:
                  return 'unknown'

          def get_model():
              try:
                  return subprocess.check_output(['dmidecode', '-s', 'system-product-name'], text=True).strip()
              except Exception:
                  return 'unknown'

          def get_bios_version():
              try:
                  return subprocess.check_output(['dmidecode', '-s', 'bios-version'], text=True).strip()
              except Exception:
                  return 'unknown'

          def get_manufacture_date():
              try:
                  return subprocess.check_output(['dmidecode', '-s', 'bios-release-date'], text=True).strip()
              except Exception:
                  return 'unknown'

          def get_cpu_generation(cpu_model_str):
              match = re.search(r'i[3579]-(\d{4,5})', cpu_model_str)
              return match.group(1) if match else 'unknown'

          def get_cpu_model():
              try:
                  with open("/proc/cpuinfo") as f:
                      for line in f:
                          if "model name" in line:
                              return line.split(":")[1].strip()
              except Exception:
                  return platform.processor() or "unknown"
              return "unknown"

          def get_processor_model():
              try:
                  with open("/proc/cpuinfo") as f:
                      for line in f:
                          if line.strip().startswith("model") and "name" not in line:
                              return line.split(":")[1].strip()
              except Exception:
                  return "unknown"
              return "unknown"

          # ----------------------------
          # Cache Monitoring
          # ----------------------------
          LOG_FILE = "/var/log/cache_cleanup.log"

          def get_last_cleared_time():
              if not os.path.exists(LOG_FILE):
                  return 0
              try:
                  with open(LOG_FILE, "r") as f:
                      last_line = f.readlines()[-1].strip()
                  date_part = last_line.split(": Cache cleared")[0]
                  epoch_time = time.mktime(time.strptime(date_part, "%A %d %B %Y %I:%M:%S %p IST"))
                  return epoch_time
              except Exception as e:
                  print(f"Error parsing log: {e}")
                  return 0

          def get_cache_status():
              last_time = get_last_cleared_time()
              if last_time == 0:
                  return 0
              last_date = time.strftime("%Y-%m-%d", time.localtime(last_time))
              today_date = time.strftime("%Y-%m-%d", time.localtime())
              return 1 if last_date == today_date else 0

          def update_cache_metrics():
              hostname = socket.gethostname()
              CACHE_STATUS.labels(hostname=hostname).set(get_cache_status())
              CACHE_TIME.labels(hostname=hostname).set(get_last_cleared_time())

          # ----------------------------
          # CrowdStrike Collector (Updated)
          # ----------------------------
          FALCONCTL = "/opt/CrowdStrike/falconctl"

          def get_crowdstrike_info():
              try:
                  # Get Sensor Version
                  version_output = subprocess.check_output(
                      ["sudo", "-i", FALCONCTL, "-g", "--version"],
                      text=True
                  ).strip()
                  version = 0
                  if "version" in version_output.lower():
                      version = int(''.join(filter(str.isdigit, version_output)))

                  # Get Cloud Connection
                  cloud_output = subprocess.check_output(
                      ["sudo", "-i", FALCONCTL, "-g", "--cloud"],
                      text=True
                  ).strip()
                  cloud = 1 if "=" in cloud_output and cloud_output.split("=")[1].strip() else 0

                  # Keep existing logic for status and last_update
                  status = 1  # Sensor running
                  try:
                      last_update = int(subprocess.check_output(
                          ["stat", "-c", "%Y", "/opt/CrowdStrike/Registry.bin"], 
                          text=True
                      ).strip())
                  except:
                      last_update = 0

                  return {
                      'status': status,
                      'cloud': cloud,
                      'version': version,
                      'last_update': last_update
                  }

              except Exception as e:
                  print(f"Error fetching CrowdStrike info: {e}")
                  return {
                      'status': 0,
                      'cloud': 0,
                      'version': 0,
                      'last_update': 0
                  }

          def update_crowdstrike_metrics():
              info = get_crowdstrike_info()
              cs_sensor_status.labels(hostname=hostname).set(info['status'])
              cs_cloud_connection.labels(hostname=hostname).set(info['cloud'])
              cs_sensor_version.labels(hostname=hostname).set(info['version'])
              cs_last_update.labels(hostname=hostname).set(info['last_update'])

          # ----------------------------
          # Collector
          # ----------------------------
          def collect():
              ram = psutil.virtual_memory()
              cpu_info = platform.processor()
              cpu_gen = get_cpu_generation(cpu_info)
              os_flavor = distro.name(pretty=True) or platform.platform()

              cpu_cores.labels(hostname=hostname).set(psutil.cpu_count(logical=False))
              ram_used.labels(hostname=hostname).set(round(ram.used / 1024 / 1024))
              ram_total.labels(hostname=hostname).set(round(ram.total / 1024 / 1024))
              cpu_utilization.labels(hostname=hostname).set(psutil.cpu_percent(interval=None))

              cpu_model.info({'hostname': hostname, 'model': get_cpu_model()})
              processor_model.info({'hostname': hostname, 'processor_model': get_processor_model()})
              cpu_generation.info({'hostname': hostname, 'generation': cpu_gen})
              os_version.info({'hostname': hostname, 'os': os_flavor})
              kernel_version.info({'hostname': hostname, 'kernel': platform.release()})
              architecture.info({'hostname': hostname, 'architecture': platform.machine()})
              ip_info.info({'hostname': hostname, 'ip': get_ip()})
              ip_all_info.info({'hostname': hostname, 'ips': ','.join(get_all_ips())})
              mac_info.info({'hostname': hostname, 'mac': get_mac()})
              serial_info.info({'hostname': hostname, 'serial': get_serial_number()})
              manufacturer_info.info({'hostname': hostname, 'manufacturer': get_manufacturer(), 'manufacture_date': get_manufacture_date()})
              model_info.info({'hostname': hostname, 'model': get_model()})
              bios_info.info({'hostname': hostname, 'bios': get_bios_version()})

              for part in psutil.disk_partitions(all=False):
                  try:
                      usage = psutil.disk_usage(part.mountpoint)
                      disk_total.labels(hostname=hostname, disk=part.device).set(usage.total)
                      disk_used.labels(hostname=hostname, disk=part.device).set(usage.used)
                  except Exception:
                      continue

              users_gauge.labels(hostname=hostname).set(len(psutil.users()))
              uptime_gauge.labels(hostname=hostname).set(time.time() - psutil.boot_time())

              update_cache_metrics()
              update_crowdstrike_metrics()
              update_patch_status()

          # ----------------------------
          # Main Loop
          # ----------------------------
          if __name__ == '__main__':
              print("📡 Exporter running on http://0.0.0.0:9888/metrics")
              start_http_server(9888, addr="0.0.0.0")
              while True:
                  collect()
                  time.sleep(30)

    - name: Run the exporter in background using root login shell
      shell: "nohup sudo -i python3 /opt/asset_agent.py > /var/log/asset_agent.log 2>&1 &"
      args:
        chdir: /opt
